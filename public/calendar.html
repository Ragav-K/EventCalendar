<!DOCTYPE html>
<html>
<head>
    <title>Calendar</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="calendar-topbar">
        <a href="index.html" class="add-event-link">Add Event</a>
        <h1>Event Calendar</h1>
    </div>

    <div class="calendar-header">
        <button id="prevMonth">&#10094;</button>
        <h2 id="monthYear"></h2>
        <button id="nextMonth">&#10095;</button>
    </div>

    <br>

    <div class="weekdays">
        <div>Sun</div>
        <div>Mon</div>
        <div>Tue</div>
        <div>Wed</div>
        <div>Thu</div>
        <div>Fri</div>
        <div>Sat</div>
    </div>

    <div id="calendar"></div>

    <div id="viewEventModal" class="modal">
        <div class="modal-content">

            <span id="closeViewModal">&times;</span>

            <h2 id="modalDate"></h2>

            <h3>Events</h3>

            <div id="eventList">
                No events for this day.
            </div>

        </div>
    </div>

    <script src="calendar.js"></script>

</body>
</html>
